plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// İmza bilgileri ASLA kaynak kodda tutulmaz: CI'da GitHub Secrets'tan, yerelde ortam değişkenlerinden gelir.
def ksFile = System.getenv("KEYSTORE_FILE") ?: "release.jks"
def hasSigning = file(ksFile).exists() && System.getenv("KEYSTORE_PASSWORD") != null

android {
    namespace 'com.remna.boost'
    compileSdk 34
    defaultConfig {
        applicationId 'com.remna.boost'
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName '2.0.0'
    }
    signingConfigs {
        release {
            if (hasSigning) {
                storeFile file(ksFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) signingConfig signingConfigs.release
        }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    testOptions { unitTests.returnDefaultValues = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}

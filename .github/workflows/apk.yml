name: Boost APK
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Keystore (GitHub Secrets)
        env: { KEYSTORE_BASE64: '${{ secrets.KEYSTORE_BASE64 }}' }
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret tanımlı değil"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
      - name: Lint + testler + release derleme
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: '${{ secrets.KEYSTORE_PASSWORD }}'
          KEY_ALIAS: '${{ secrets.KEY_ALIAS }}'
          KEY_PASSWORD: '${{ secrets.KEY_PASSWORD }}'
        run: gradle lintRelease testReleaseUnitTest assembleRelease --no-daemon --stacktrace
      - name: APK imza doğrulama
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk RemnaBoost.apk
      - name: Anahtar dosyasını sil
        if: always()
        run: rm -f app/release.jks
      - uses: softprops/action-gh-release@v2
        with: { tag_name: 'v1.5.1-${{ github.run_number }}', name: 'Remna Boost 1.5.1 (${{ github.run_number }})', files: RemnaBoost.apk, make_latest: true }
